[project]
name = "crowdsense"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-postgresql>=9.1.1",
    "ruff>=0.17.1",
]
