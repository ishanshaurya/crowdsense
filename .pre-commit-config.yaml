repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy-core
        name: mypy (strict, core/)
        entry: uv run mypy core
        language: system
        pass_filenames: false
        files: ^(core/|pyproject\.toml)
      - id: import-linter
        name: import-linter contracts
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        types: [python]
      - id: detect-secrets
        name: detect-secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
